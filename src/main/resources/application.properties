server.port=8080
spring.application.name=oj

# 敏感配置（API Key 等）放 application-local.properties，该文件不提交到 Git
spring.profiles.active=local

# ---------- 数据源 ----------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/oj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- MyBatis ----------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.zzh.oj.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- Redis ----------
# 先指向虚拟机；Redis 没装好时，提交限流会自动降级成"不限流"，不影响判题
spring.data.redis.host=192.168.100.128
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# 提交限流：同一用户每 60 秒最多 10 次
oj.rate-limit.submit.limit=10
oj.rate-limit.submit.window-seconds=60

# ---------- AI 代码评审 ----------
# ★ Key 不写在这里。写在 application-local.properties（已加入 .gitignore）
#   部署到服务器时用启动参数传，见 /etc/systemd/system/oj.service
oj.ai.enabled=true
oj.ai.mock=false
oj.ai.api-key=
oj.ai.base-url=https://api.deepseek.com/v1
oj.ai.model=deepseek-chat

# ---------- 判题工具路径 ----------
# Windows 开发环境（部署到 Linux 时用启动参数覆盖，见 oj.service）
oj.judge.javac=D:/Dev/jdk-17.0.19.10-hotspot/bin/javac.exe
oj.judge.java=D:/Dev/jdk-17.0.19.10-hotspot/bin/java.exe

# ---------- 日志 ----------
logging.level.com.zzh.oj.mapper=debug

# ---------- JSON ----------
# 值为 null 的字段不输出（列表页的 description 就不会变成 "description": null）
spring.jackson.default-property-inclusion=non_null
